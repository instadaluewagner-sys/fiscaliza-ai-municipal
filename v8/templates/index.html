<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fiscaliza.AI V8</title>
  <link rel="stylesheet" href="/v8-static/app.css">
</head>
<body>
  <main class="shell">
    <header>
      <span class="tag">V8 · ambiente paralelo</span>
      <h1>Penalização contratual</h1>
      <p>Primeiro núcleo da reconstrução: documentos → evidências → estágio → próximo ato.</p>
    </header>
    <section class="panel">
      <h2>Testar análise</h2>
      <form id="form">
        <input id="files" type="file" accept="application/pdf" multiple required>
        <button>Analisar processo</button>
      </form>
      <p class="note">Esta V8 não substitui a versão pública atual. É um ambiente de validação técnica.</p>
    </section>
    <section id="out" class="panel hidden" aria-live="polite"></section>
  </main>
  <script src="/v8-static/app.js"></script>
</body>
</html>
