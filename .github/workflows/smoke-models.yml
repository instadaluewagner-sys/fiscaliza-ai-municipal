name: Smoke Models

on:
  push:
    branches: [ main ]
    paths:
      - "app_v33.py"
      - "rc1_patch.py"
      - "smoke_models.py"
      - ".github/workflows/smoke-models.yml"
  workflow_dispatch:

jobs:
  smoke-models:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pymupdf python-multipart reportlab pytesseract pillow httpx

      - name: Run six-module smoke test
        run: python smoke_models.py
